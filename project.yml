name: HermesIOS
options:
  bundleIdPrefix: org.hermesios
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: 1
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    GENERATE_INFOPLIST_FILE: NO
packages:
  WebRTC:
    url: https://github.com/stasel/WebRTC.git
    exactVersion: 153.0.0
  # The CloudKit mailbox and the loopback Hermes adapter. Local, so the bridge and the iOS app share
  # exactly one implementation of the wire and storage rules.
  NeoCloudBridge:
    path: Packages/NeoCloudBridge
targets:
  HermesIOS:
    type: application
    platform: iOS
    sources: [HermesIOS]
    dependencies:
      - package: WebRTC
      - target: HermesIOSNotificationService
        embed: true
      - target: HermesIOSWidgets
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.hermesios.HermesIOS
        INFOPLIST_FILE: HermesIOS/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: HermesIOS/Resources/HermesIOS.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
    scheme:
      testTargets: [HermesIOSUITests]
  HermesIOSNotificationService:
    type: app-extension
    platform: iOS
    sources:
      - HermesIOSNotificationService
      - path: HermesIOS/Core
        includes:
          - JSONValue.swift
          - NotificationCrypto.swift
          - NotificationEnvelope.swift
          - NotificationKeyStore.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.hermesios.HermesIOS.NotificationService
        INFOPLIST_FILE: HermesIOSNotificationService/Info.plist
        CODE_SIGN_ENTITLEMENTS: HermesIOSNotificationService/HermesIOSNotificationService.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"
        SKIP_INSTALL: YES
  HermesIOSWidgets:
    type: app-extension
    platform: iOS
    sources:
      - HermesIOSWidgets
      - path: HermesIOS/Core
        includes:
          - WidgetSnapshot.swift
          - WidgetSnapshotStore.swift
      - path: HermesIOS/LiveActivity
        includes:
          - HermesActivityAttributes.swift
          - ActivityIntents.swift
      - path: HermesIOS/Features
        includes:
          - OrbView.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.hermesios.HermesIOS.Widgets
        INFOPLIST_FILE: HermesIOSWidgets/Info.plist
        CODE_SIGN_ENTITLEMENTS: HermesIOSWidgets/HermesIOSWidgets.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"
        SKIP_INSTALL: YES
  # macOS bridge app: pulls the mailbox, runs one turn at a time against the local `hermes serve`
  # and publishes the answer. Not embedded in the iOS app; it is a separate, user-launched app.
  NeoOSBridge:
    type: application
    platform: macOS
    sources:
      - path: NeoOSBridge
        excludes:
          - Resources/Info.plist
          - NeoOSBridge.entitlements
    dependencies:
      - package: NeoCloudBridge
        product: CloudBridgeCore
      - package: NeoCloudBridge
        product: CloudBridgeSync
      - package: NeoCloudBridge
        product: HermesBridgeClient
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.neil.NeoOSBridge
        INFOPLIST_FILE: NeoOSBridge/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: NeoOSBridge/NeoOSBridge.entitlements
        DEVELOPMENT_TEAM: S8X8W7J77M
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        COMBINE_HIDPI_IMAGES: YES
  NeoOSBridgeTests:
    type: bundle.unit-test
    platform: macOS
    sources: [NeoOSBridgeTests]
    dependencies:
      - target: NeoOSBridge
      - package: NeoCloudBridge
        product: CloudBridgeCore
      - package: NeoCloudBridge
        product: CloudBridgeSync
      - package: NeoCloudBridge
        product: HermesBridgeClient
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.neil.NeoOSBridgeTests
        GENERATE_INFOPLIST_FILE: YES
        DEVELOPMENT_TEAM: S8X8W7J77M
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/NeoOSBridge.app/Contents/MacOS/NeoOSBridge"
        BUNDLE_LOADER: "$(TEST_HOST)"
  HermesIOSVoiceTests:
    type: bundle.unit-test
    platform: iOS
    sources: [HermesIOSVoiceTests]
    dependencies:
      - target: HermesIOS
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/HermesIOS.app/HermesIOS"
        BUNDLE_LOADER: "$(TEST_HOST)"
  HermesIOSUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [HermesIOSUITests]
    dependencies:
      - target: HermesIOS
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: HermesIOS
schemes:
  HermesIOSIntegration:
    build:
      targets:
        HermesIOS: all
        HermesIOSUITests: [test]
        HermesIOSVoiceTests: [test]
    test:
      targets: [HermesIOSUITests, HermesIOSVoiceTests]
      environmentVariables:
        HERMES_IOS_INTEGRATION: "1"
  # The macOS bridge: build and run the controller tests from the same scheme.
  NeoOSBridge:
    build:
      targets:
        NeoOSBridge: all
        NeoOSBridgeTests: [test]
    test:
      targets: [NeoOSBridgeTests]
  HermesIOS:
    build:
      targets:
        HermesIOS: all
        HermesIOSUITests: [test]
    test:
      targets: [HermesIOSUITests]
